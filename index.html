<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0a14">
<meta name="description" content="Pass the Boom — a hot-potato chase party game. Tag someone before the fuse runs out!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pass the Boom">
<title>Pass the Boom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23ff6b2c'/%3E%3Crect x='28' y='10' width='8' height='14' rx='2' fill='%23ffd84a'/%3E%3Ccircle cx='32' cy='10' r='4' fill='%23ff3a3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Title / home -->
  <section id="screen-home" class="screen">
    <div class="hero">
      <div class="logo-boom" aria-hidden="true">💣</div>
      <h1>Pass the Boom</h1>
      <p class="tagline">Chase · Tag · Don't explode!</p>
    </div>
    <div class="stack">
      <label class="field">
        <span>Your name</span>
        <input id="nameInput" type="text" maxlength="12" autocomplete="nickname" placeholder="Player" enterkeyhint="done">
      </label>
      <button id="btnCreate" class="btn big primary">Create room</button>
      <button id="btnJoinShow" class="btn big">Join room</button>
    </div>
    <p class="hint">Works best on phones. Open two tabs to test.</p>
  </section>

  <!-- Join form -->
  <section id="screen-join" class="screen hidden">
    <h2>Join a room</h2>
    <div class="stack">
      <label class="field">
        <span>Room code</span>
        <input id="codeInput" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" enterkeyhint="go">
      </label>
      <button id="btnJoin" class="btn big primary">Join</button>
      <button id="btnJoinBack" class="btn ghost">Back</button>
    </div>
    <p id="joinErr" class="err" hidden></p>
  </section>

  <!-- Lobby -->
  <section id="screen-lobby" class="screen hidden">
    <h2>Lobby</h2>
    <div class="code-card">
      <span class="label">Room code</span>
      <div id="lobbyCode" class="code">····</div>
      <p class="hint">Share this code with friends</p>
    </div>
    <ul id="playerList" class="player-list"></ul>
    <label id="kidsWrap" class="toggle hidden">
      <input type="checkbox" id="kidsMode">
      <span>Kids Mode <small>(longer fuse)</small></span>
    </label>
    <div class="stack">
      <button id="btnStart" class="btn big primary hidden">Start match</button>
      <button id="btnLeave" class="btn ghost">Leave</button>
    </div>
    <p id="lobbyStatus" class="hint">Waiting for host…</p>
  </section>

  <!-- Play -->
  <section id="screen-play" class="screen play hidden">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div id="hud">
      <div class="hud-top">
        <div id="fuseBar" class="fuse" title="Fuse">
          <div id="fuseFill"></div>
          <b id="fuseTxt">—</b>
        </div>
        <div id="boomBadge" class="boom-badge hidden">YOU HAVE THE BOOM!</div>
        <div id="aliveChip" class="chip">Alive <b id="aliveTxt">0</b></div>
      </div>
      <div id="toast"></div>
      <div id="joy" class="hidden"><div class="ring"></div><div class="knob"></div></div>
    </div>
  </section>

  <!-- Winner -->
  <section id="screen-win" class="screen hidden">
    <div class="hero">
      <div class="logo-boom">🏆</div>
      <h1 id="winTitle">Winner!</h1>
      <p id="winName" class="tagline"></p>
    </div>
    <div class="stack">
      <button id="btnAgain" class="btn big primary">Play again</button>
      <button id="btnHome" class="btn ghost">Back to home</button>
    </div>
  </section>

  <!-- Connecting overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="spinner"></div>
    <p id="overlayTxt">Connecting…</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
